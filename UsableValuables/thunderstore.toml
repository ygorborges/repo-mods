[config]
schemaVersion = "0.0.1"

[package]
namespace = "vibez"
name = "UsableValuables"
versionNumber = "0.2.0"
description = "Hold a valuable and press E to use it (flashlight, boombox, candle, saws, traps, flamethrower, wands, camera). Some valuables act up by themselves, and a new one, a dish sponge, blows bubbles and drips when moved."
websiteUrl = "https://github.com/ygorborges/repo-mods/tree/main/UsableValuables"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Zehs-REPOLib = "4.2.0"

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build"

[[build.copy]]
source = "./package/UsableValuables.dll"
target = "/"

[[build.copy]]
source = "./package/CHANGELOG.md"
target = "/"

[[build.copy]]
source = "./package/audio"
target = "/audio"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]
[publish.categories]
repo = ["mods", "quality-of-life", "valuables", "ai-generated"]
