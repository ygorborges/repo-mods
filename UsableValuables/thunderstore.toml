[config]
schemaVersion = "0.0.1"

[package]
namespace = "vibez"
name = "UsableValuables"
versionNumber = "0.1.3"
description = "Hold a valuable and press E to use it: switch the flashlight, boombox, candle, ice saw and other power-on valuables off and on, fire the flamethrower, cast the star wand, fire the wizard staff, set off the camera flash."
websiteUrl = "https://github.com/ygorborges/repo-mods/tree/main/UsableValuables"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build"

[[build.copy]]
source = "./package/UsableValuables.dll"
target = "/"

[[build.copy]]
source = "./package/CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]
[publish.categories]
repo = ["mods", "quality-of-life", "valuables", "ai-generated"]
