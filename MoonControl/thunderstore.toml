[config]
schemaVersion = "0.0.1"

[package]
namespace = "vibez"
name = "MoonControl"
versionNumber = "1.0.0"
description = "The game raises the moon on its own every 5 levels and never lowers it. This puts it in your hands: it stays off until you grab the moon button in the truck, capped by what your run has unlocked, and a harder moon makes every valuable worth more."
websiteUrl = "https://github.com/ygorborges/repo-mods/tree/main/MoonControl"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
nickklmao-MenuLib = "2.5.4"
Zehs-REPOLib = "4.2.0"

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build"

[[build.copy]]
source = "./package/MoonControl.dll"
target = "/"

[[build.copy]]
source = "./package/CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]
[publish.categories]
repo = ["mods", "quality-of-life", "ai-generated"]
